<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical Genius</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎼 Classical Genius</h1>
        <p>Testa la tua conoscenza della musica classica</p>
    </header>

    <main>
        <section id="filtri">
            <h2>Scegli come vuoi giocare</h2>
            
            <div class="filtro-gruppo">
                <label>Periodo</label>
                <select id="sel-periodo">
                    <option value="">-- Tutti i periodi --</option>
                </select>
            </div>

            <div class="filtro-gruppo">
                <label>Nazione</label>
                <select id="sel-nazione">
                    <option value="">-- Tutte le nazioni --</option>
                </select>
            </div>

            <div class="filtro-gruppo">
                <label>Compositore</label>
                <select id="sel-compositore">
                    <option value="">-- Tutti i compositori --</option>
                </select>
            </div>

            <div class="filtro-gruppo">
                <label>Forma musicale</label>
                <select id="sel-forma">
                    <option value="">-- Tutte le forme --</option>
                </select>
            </div>

            <button id="btn-gioca">🎵 Inizia a giocare!</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
